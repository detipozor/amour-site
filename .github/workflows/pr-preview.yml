# A "Preview in WordPress Playground" button in every pull request (HANDOFF, section 18, level 2).
# WordPress runs in the reviewer's browser with the theme from the pull request branch;
# no booking engine, no mail, no real domain.
name: Playground preview

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: WordPress/action-wp-playground-pr-preview@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          blueprint: |
            {
              "$schema": "https://playground.wordpress.net/blueprint-schema.json",
              "preferredVersions": { "php": "8.2", "wp": "latest" },
              "landingPage": "/",
              "steps": [
                { "step": "defineWpConfigConsts", "consts": { "WP_ENVIRONMENT_TYPE": "local" } },
                { "step": "installPlugin",
                  "pluginData": { "resource": "wordpress.org/plugins", "slug": "secure-custom-fields" },
                  "options": { "activate": true } },
                { "step": "installPlugin",
                  "pluginData": { "resource": "wordpress.org/plugins", "slug": "polylang" },
                  "options": { "activate": true } },
                { "step": "installPlugin",
                  "pluginData": {
                    "resource": "git:directory",
                    "url": "https://github.com/${{ github.repository }}.git",
                    "ref": "${{ github.event.pull_request.head.ref }}",
                    "path": "wp-content/plugins/amour-core"
                  },
                  "options": { "activate": true, "targetFolderName": "amour-core" } },
                { "step": "installTheme",
                  "themeData": {
                    "resource": "git:directory",
                    "url": "https://github.com/${{ github.repository }}.git",
                    "ref": "${{ github.event.pull_request.head.ref }}",
                    "path": "wp-content/themes/amour"
                  },
                  "options": { "activate": true, "targetFolderName": "amour" } },
                { "step": "wp-cli", "command": "wp amour seed" },
                { "step": "login", "username": "admin" }
              ]
            }
