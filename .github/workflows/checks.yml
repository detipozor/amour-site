# Autotests from HANDOFF, section 15: code checks and site tests on every pull request.
name: Checks

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code checks (PHP, JS, CSS and brand rules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npm run lint

  e2e:
    name: Site tests (pages, widths, axe, keyboard)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start WordPress
        run: npx wp-env start
      - name: Fill the site
        run: npm run wp:seed
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  speed:
    name: Speed (Lighthouse on a phone, home, room, booking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start WordPress
        run: npx wp-env start
      - name: Fill the site
        run: npm run wp:seed
      # A live site answers from warm caches; the first request after the start does not.
      - name: Warm up the pages
        run: for page in / /rooms/superior-queen-room/ /book/; do curl -s -o /dev/null "http://localhost:8888$page"; done
      # HANDOFF, section 15: a phone, speed from 85, accessibility from 95, the median score of three runs.
      # Reports stay in this run (no outside service).
      - run: npm run speed
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouseci/reports/
          retention-days: 14
